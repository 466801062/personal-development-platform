<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>个人提升管理平台</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#f4f6fb;
  color:#1e2233;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:root{
  --purple:#7c3aed;
  --purple-l:#a78bfa;
  --green:#10b981;
  --red:#ef4444;
  --amber:#f59e0b;
  --blue:#2563eb;
  --text:#1e2233;
  --muted:#6b7280;
  --faint:#9aa0b4;
  --line:#e8eaf2;
  --card:#ffffff;
}

/* ============ 布局 ============ */
.layout{display:block}
.main{padding:16px 14px 96px;max-width:1180px;margin:0 auto}
@media(min-width:1024px){
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  .main{padding:28px 32px 60px;margin:0;max-width:none;width:100%}
}

/* ============ 导航 ============ */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav .brand{display:none}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 4px;border-radius:12px;color:var(--faint);
  font-size:11px;font-weight:500;transition:.18s;
}
.nav button svg{width:21px;height:21px}
.nav button.active{color:var(--purple);background:linear-gradient(180deg,rgba(124,58,237,.10),rgba(124,58,237,.03))}
@media(min-width:768px) and (max-width:1023px){
  .nav{
    position:sticky;top:0;bottom:auto;
    justify-content:flex-start;gap:6px;
    padding:10px 16px;border-top:none;border-bottom:1px solid var(--line);
  }
  .nav button{flex:0 0 auto;flex-direction:row;gap:7px;font-size:14px;padding:8px 15px;border-radius:10px}
  .nav button svg{width:17px;height:17px}
}
@media(min-width:1024px){
  .nav{
    position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;
    flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;
    padding:22px 14px;border-top:none;border-right:1px solid var(--line);
    background:#fff;
  }
  .nav .brand{
    display:flex;align-items:center;gap:9px;
    padding:0 8px 18px;font-weight:700;font-size:15.5px;letter-spacing:-.2px;
  }
  .nav .brand .logo{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .nav .brand .logo svg{width:17px;height:17px}
  .nav button{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;
    font-size:14.5px;padding:11px 14px;border-radius:11px;
  }
  .nav button svg{width:18px;height:18px}
  .nav button:hover{background:#f5f4fe;color:var(--purple)}
}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h1{margin:0;font-size:23px;letter-spacing:-.4px;font-weight:700}
.page-head .sub{margin:3px 0 0;color:var(--faint);font-size:13px}
@media(min-width:1024px){.page-head h1{font-size:27px}}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:11px;font-size:14px;font-weight:600;
  border:1px solid var(--line);background:#fff;color:var(--text);
  transition:.16s;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:hover{background:#f7f7fc}
.btn:active{transform:scale(.97)}
.btn.primary{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;border-color:transparent;
  box-shadow:0 6px 18px -6px rgba(124,58,237,.6);
}
.btn.primary:hover{background:linear-gradient(135deg,#6d28d9,#9333ea)}
.btn.big{padding:14px 20px;font-size:15px;border-radius:14px}
.btn.block{width:100%;margin-top:6px}
.btn.danger{color:var(--red);border-color:#fbd5d5;background:#fff5f5}
.btn.danger:hover{background:#ffecec}
.btn.review-ok{color:#059669;border-color:#a7f3d0;background:#f0fdf4}
.btn.review-ok:hover{background:#dcfce7}
.btn:disabled{opacity:.45;cursor:not-allowed}

.btn.primary[data-action="checkin"]{
  background:#ef4444;
  border-color:#ef4444;
  color:#fff;
  box-shadow:0 6px 18px -6px rgba(239,68,68,.55);
}
.btn.primary[data-action="checkin"]:hover{background:#dc2626;border-color:#dc2626}
.btn.primary[data-action="checkin"]:active{background:#b91c1c;border-color:#b91c1c;transform:scale(.97)}

.card{
  background:var(--card);border-radius:16px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(24,26,52,.035),0 10px 26px -18px rgba(24,26,52,.18);
  padding:16px;
}

.section{margin-bottom:22px}
.section-title{
  display:flex;align-items:center;gap:7px;
  margin:0 0 11px;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.2px;
}
.section-title svg{width:16px;height:16px;color:var(--purple)}

.goal-list{display:flex;flex-direction:column;gap:14px}
@media(min-width:1024px){
  .goal-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
}

/* ============ 分类标签 ============ */
.cat-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2.5px 9px;border-radius:99px;
  font-size:11px;font-weight:700;letter-spacing:.1px;
  background:#eef0f7;color:#6b7280;
  flex:0 0 auto;white-space:nowrap;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;
  line-height:1.5;
}

/* ============ 分类筛选栏 ============ */
.cat-filter-bar{
  display:flex;gap:8px;overflow-x:auto;
  padding:2px 0 10px;
  margin-bottom:6px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cat-filter-bar::-webkit-scrollbar{display:none}
.cat-filter-bar:empty{display:none}
.filter-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:99px;
  border:1px solid var(--line);background:#fff;
  color:var(--muted);font-size:12.5px;font-weight:600;
  flex:0 0 auto;cursor:pointer;transition:.15s;white-space:nowrap;
}
.filter-chip:hover{border-color:#ddd6fe;color:#6d28d9;background:#faf8ff}
.filter-chip.active{
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px -4px rgba(124,58,237,.5);
}
.filter-chip .fc-count{
  font-size:10.5px;font-weight:700;
  background:rgba(0,0,0,.06);color:inherit;
  padding:1px 6px;border-radius:99px;
}
.filter-chip.active .fc-count{background:rgba(255,255,255,.25)}

/* ============ 今日未打卡提醒 ============ */
.reminder-banner{
  display:flex;align-items:flex-start;gap:12px;
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:1px solid #fcd34d;
  border-radius:14px;
  padding:12px 15px;margin-bottom:16px;
  color:#78350f;font-size:13.5px;line-height:1.55;
}
.reminder-banner svg{width:20px;height:20px;flex:0 0 auto;color:#d97706;margin-top:1px}
.reminder-banner b{font-weight:700}
.reminder-banner .rb-title{font-weight:600}
.reminder-banner .rb-list{
  font-size:12.5px;color:#92400e;opacity:.92;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ============ 备份横幅 ============ */
.backup-banner{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(135deg,#f5f3ff,#ede9fe);
  border:1px solid #ddd6fe;border-radius:14px;
  padding:13px 15px;margin-bottom:18px;font-size:13.5px;color:#4c1d95;
}
.backup-banner svg{width:20px;height:20px;flex:0 0 auto;color:#7c3aed}
.backup-banner .bb-text{flex:1 1 200px;line-height:1.5}
.backup-banner .btn{background:#fff;border-color:#ddd6fe;color:#6d28d9;padding:7px 13px;font-size:13px}

/* ============ 抗遗忘复习 ============ */
.review-list{display:flex;flex-direction:column;gap:10px}
.review-item{
  display:flex;align-items:flex-start;gap:12px;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:0 1px 2px rgba(24,26,52,.035),0 8px 22px -18px rgba(24,26,52,.2);
  position:relative;overflow:hidden;
}
.review-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,#7c3aed)}
.ri-main{flex:1;min-width:0}
.ri-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.ri-goal{font-weight:700;font-size:13.5px}
.ri-tag{
  font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  background:#ede9fe;color:#6d28d9;flex:0 0 auto;letter-spacing:.2px;
}
.ri-tag.hot{background:#fef2f2;color:#dc2626}
.ri-meta{font-size:12px;color:var(--faint);margin-bottom:6px}
.ri-summary{
  font-size:12.5px;color:#4b5163;line-height:1.62;
  background:#f8f9fd;border-radius:9px;padding:8px 10px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  cursor:pointer;transition:.15s;
}
.ri-summary:hover{background:#f3f4fa}
.ri-summary.expanded{display:block;-webkit-line-clamp:unset;overflow:visible}
.ri-summary.empty{
  color:#b6bacb;font-style:italic;cursor:default;background:#fbfbfe;
  border:1px dashed #e8eaf2;
}
.ri-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.ri-actions .btn{padding:7px 12px;font-size:12.5px}

/* ============ 目标卡 ============ */
.goal-card{position:relative;overflow:hidden}
.goal-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--gc);border-radius:0 4px 4px 0;
}
.goal-card.pending::before{background:linear-gradient(180deg,#f59e0b,#ef4444)}
.goal-card.pending .gc-dot{background:#ef4444;animation:pulseDot 2s infinite}
@keyframes pulseDot{
  0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.18)}
  50%{box-shadow:0 0 0 6px rgba(239,68,68,.08)}
}

.status-banner{
  display:flex;gap:9px;align-items:flex-start;
  border-radius:11px;padding:10px 12px;margin:-2px 0 13px;font-size:13px;line-height:1.5;
}
.status-banner svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.status-banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.status-banner.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.status-banner b{font-weight:700}

.gc-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.gc-dot{width:9px;height:9px;border-radius:50%;background:var(--gc);flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 18%,transparent);transition:.2s}
.gc-name{margin:0;font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gc-actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{
  width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);transition:.15s;
}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:#f3f4f9;color:var(--muted)}
.icon-btn.danger:hover{background:#fef2f2;color:var(--red)}

.gc-stats{display:flex;gap:6px;margin-bottom:11px}
.stat{
  flex:1;min-width:0;background:#f8f9fd;border-radius:10px;padding:8px 9px;
  display:flex;flex-direction:column;gap:1px;
}
.stat-v{font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-l{font-size:11px;color:var(--faint)}
.stat-v.good{color:var(--green)}
.stat-v.bad{color:var(--red)}

.bar{height:9px;border-radius:99px;background:#eef0f7;overflow:hidden;margin-bottom:7px}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#fff));transition:width .45s cubic-bezier(.4,0,.2,1)}
.bar-meta{font-size:12px;color:var(--faint);margin-bottom:12px;line-height:1.5}
.bar-meta b{color:var(--muted);font-weight:600}

.plan-box{
  background:#f8f9fd;border-radius:11px;padding:10px 12px;margin-bottom:13px;
  font-size:12.5px;line-height:1.6;color:#4b5163;
}
.plan-box .pl{display:flex;gap:7px;align-items:flex-start}
.plan-box .pl+.pl{margin-top:6px}
.plan-box .pl svg{width:14px;height:14px;flex:0 0 auto;margin-top:2.5px;color:var(--purple-l)}
.plan-box .pl.ob svg{color:#f59e0b}
.plan-box .pl b{font-weight:600;color:#3d4258}

.note-bar{display:flex;gap:7px;margin-bottom:12px}
.note-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 10px;border-radius:10px;border:1px solid var(--line);
  background:#fbfbfe;color:var(--muted);font-size:12.5px;font-weight:600;
  transition:.15s;position:relative;
}
.note-btn svg{width:14px;height:14px}
.note-btn:hover{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}
.note-btn .badge{
  position:absolute;top:-5px;right:-4px;min-width:17px;height:17px;padding:0 4px;
  border-radius:99px;background:var(--amber);color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

.checkin{border-top:1px dashed var(--line);padding-top:12px}
.checkin-row{display:flex;gap:8px;align-items:center}
.checkin-row+.checkin-row{margin-top:8px}
.inp{
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;
  width:100%;min-width:0;transition:.15s;font-size:14px;
}
.inp:focus{outline:none;border-color:var(--purple-l);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa0b4' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 8px center;background-size:15px;padding-right:30px;cursor:pointer}

.amount-seg-box{
  margin-top:10px;
  background:#f5f3ff;border-radius:12px;padding:12px 13px;
  border:1px solid #ede9fe;
}
.as-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:10px;
}
.as-head .as-lbl{
  display:flex;align-items:center;gap:6px;
  font-size:15px;color:#6d28d9;font-weight:700;
}
.as-head .as-lbl svg{width:16px;height:16px;flex:0 0 auto;color:#a78bfa}
.as-total{
  display:inline-flex;align-items:center;justify-content:flex-end;
  height:auto;padding:4px 9px;margin:0;
  border-radius:8px;background:#ede9fe;
  font-weight:700;color:#7c3aed;font-size:13.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;
}
.as-total.empty{color:#a78bfa;font-weight:500;font-size:12px;background:#f3f0ff}

.as-list{display:flex;flex-direction:column;gap:9px}
.as-row{display:flex;align-items:center;gap:7px}
.as-row input[type="number"]{
  flex:1 1 0;min-width:0;width:100%;
  border:1px solid #e2e5ef;border-radius:11px;
  padding:11px 12px;font-size:13px;font-weight:400;
  background:#fff;color:#1e2233;font-variant-numeric:tabular-nums;
  height:46px;transition:.15s;
}
.as-row input[type="number"]:focus{
  outline:none;border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.18);
}
.as-row input[type="number"]::placeholder{
  font-size:12.5px;font-weight:400;color:#b6bacb;
}
.as-row input[type="number"]::-webkit-outer-spin-button,
.as-row input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.as-row input[type="number"]{-moz-appearance:textfield;appearance:textfield}
.as-sep{
  display:flex;align-items:center;justify-content:center;
  color:#a78bfa;font-size:14px;font-weight:700;flex:0 0 auto;
  padding:0 1px;min-width:14px;height:46px;
}
.as-sum{
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;min-width:44px;height:auto;
  padding:4px 8px;border-radius:8px;background:#ede9fe;
  font-size:12.5px;font-weight:700;color:#7c3aed;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.as-sum.empty{color:#a78bfa;font-weight:500;font-size:11.5px;background:#f3f0ff}
.as-del{
  width:28px;flex:0 0 28px;align-self:center;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#c8ccda;transition:.15s;
}
.as-del:hover{background:#fef2f2;color:var(--red)}
.as-del svg{width:13px;height:13px}
.as-add{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px;border-radius:10px;border:1px dashed #c4b5fd;
  color:#7c3aed;font-size:13px;font-weight:600;margin-top:10px;
  transition:.15s;background:#fff;
}
.as-add:hover{background:#ede9fe}
.as-add svg{width:14px;height:14px}

.as-done{
  margin-top:12px;padding-top:11px;
  border-top:1px dashed #ddd6fe;
}
.as-done-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;color:#6d28d9;font-weight:700;margin-bottom:8px;
}
.as-done-head .asd-count{
  font-weight:600;color:#a78bfa;font-size:11px;
}
.as-done-empty{
  font-size:12px;color:#a78bfa;padding:6px 0;text-align:center;opacity:.7;
}
.asd-row{
  display:flex;align-items:center;gap:8px;
  padding:6px 9px;border-radius:8px;background:#fff;
  border:1px solid #ede9fe;margin-bottom:5px;
  font-size:12px;line-height:1.4;
}
.asd-row:last-child{margin-bottom:0}
.asd-range{
  font-variant-numeric:tabular-nums;color:#6d28d9;font-weight:600;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.asd-amount{
  color:#059669;font-weight:700;flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.asd-del{
  width:20px;height:20px;border-radius:6px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  color:#c8ccda;transition:.15s;
}
.asd-del svg{width:11px;height:11px}
.asd-del:hover{background:#fef2f2;color:var(--red)}

.time-seg-box{
  margin-top:10px;
  background:#f8f9fd;border-radius:12px;padding:13px 14px;
}
.ts-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:11px;
}
.ts-head .ts-lbl{
  display:flex;align-items:center;gap:6px;
  font-size:15px;color:#6b7280;font-weight:600;
}
.ts-head .ts-lbl svg{width:16px;height:16px;color:#a78bfa;flex:0 0 auto}
.ts-total{
  display:inline-flex;align-items:center;justify-content:flex-end;
  height:auto;padding:4px 9px;margin:0;
  border-radius:8px;background:#ede9fe;
  font-weight:700;color:#7c3aed;font-size:13.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;
}
.ts-total.empty{color:#a78bfa;font-weight:500;font-size:12px;background:#f3f0ff}
.ts-list{display:flex;flex-direction:column;gap:9px}
.ts-row{display:flex;align-items:center;gap:7px}
.ts-row input[type="time"]{
  flex:1 1 0;min-width:0;width:100%;
  border:1px solid #e2e5ef;border-radius:11px;
  padding:11px 12px;font-size:15.5px;background:#fff;color:#1e2233;
  font-variant-numeric:tabular-nums;transition:.15s;
  -webkit-appearance:none;appearance:none;height:46px;
}
.ts-row input[type="time"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;padding:0;margin-left:2px}
.ts-row input[type="time"]:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.ts-sep{
  display:flex;align-items:center;justify-content:center;
  color:#c3c7d6;font-size:14px;font-weight:600;flex:0 0 auto;
  padding:0 1px;min-width:10px;height:46px;
}
.ts-min{
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;min-width:40px;height:auto;
  padding:4px 8px;border-radius:8px;background:#ecfdf5;
  font-size:12.5px;font-weight:700;color:#059669;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.ts-min.empty{color:#a78bfa;font-weight:500;font-size:11.5px;background:#f3f0ff}
.ts-del{
  width:28px;flex:0 0 28px;align-self:center;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#c8ccda;transition:.15s;
}
.ts-del:hover{background:#fef2f2;color:var(--red)}
.ts-del svg{width:13px;height:13px}
.ts-add{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:9px;border-radius:10px;border:1px dashed #d8dbea;
  color:#9aa0b4;font-size:13px;font-weight:600;margin-top:10px;
  transition:.15s;background:#fff;
}
.ts-add:hover{border-color:#c4b5fd;color:#7c3aed;background:#faf8ff}
.ts-add svg{width:14px;height:14px}

.goal-progress{
  margin-top:12px;padding:11px 12px;border-radius:12px;
  background:#f8f9fd;border:1px solid #eef0f7;
}
.gp-top{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:12.5px;margin-bottom:8px;
}
.gp-lbl{color:#6b7280}
.gp-lbl b{color:#1e2233;font-weight:700;font-variant-numeric:tabular-nums}
.gp-status{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.gp-status.short{color:#d97706}
.gp-status.ok{color:#059669}
.gp-status.over{color:#7c3aed}
.gp-bar{height:8px;border-radius:99px;background:#eef0f7;overflow:hidden}
.gp-fill{
  height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);
  transition:width .3s cubic-bezier(.4,0,.2,1);
}
.gp-fill.ok{background:linear-gradient(90deg,#34d399,#10b981)}
.gp-fill.over{background:linear-gradient(90deg,#a855f7,#7c3aed)}

@media(max-width:480px){
  .amount-seg-box{padding:11px 11px}
  .as-row{gap:5px}
  .as-row input[type="number"]{font-size:14px;font-weight:400;height:44px;padding:9px 8px;border-radius:10px}
  .as-row input[type="number"]::placeholder{font-size:13px}
  .as-sep{font-size:12px;min-width:10px;height:44px}
  .as-sum{min-width:40px;font-size:12px;height:auto;padding:3px 7px}
  .as-del{width:24px;flex:0 0 24px;height:24px}
  .as-head .as-lbl{font-size:14px}
  .as-total{font-size:12.5px;height:auto;padding:3px 8px}
  .as-total.empty{font-size:11.5px}
  .as-done-head{font-size:11px}

  .time-seg-box{padding:11px 11px}
  .ts-row{gap:5px}
  .ts-row input[type="time"]{font-size:16px;height:44px;padding:9px 8px;border-radius:10px}
  .ts-sep{font-size:12px;min-width:8px;height:44px}
  .ts-min{min-width:36px;font-size:12px;height:auto;padding:3px 7px}
  .ts-del{width:24px;flex:0 0 24px;height:24px}
  .ts-head .ts-lbl{font-size:14px}
  .ts-total{font-size:12.5px;height:auto;padding:3px 8px}
  .ts-total.empty{font-size:11.5px}
}
@media(max-width:360px){
  .as-row input[type="number"]{font-size:13px;font-weight:400;padding:8px 6px;height:42px}
  .as-row input[type="number"]::placeholder{font-size:12px}
  .as-sum{min-width:34px;font-size:11px;height:auto;padding:3px 6px}
  .as-del{width:22px;flex:0 0 22px;height:22px}
  .as-sep{height:42px}
  .as-total{height:auto;padding:3px 7px;font-size:11.5px}
  .as-total.empty{font-size:11px}
  .ts-row input[type="time"]{font-size:15px;padding:8px 6px;height:42px}
  .ts-min{min-width:30px;font-size:11px;height:auto;padding:3px 6px}
  .ts-del{width:22px;flex:0 0 22px;height:22px}
  .ts-sep{height:42px}
  .ts-total{height:auto;padding:3px 7px;font-size:11.5px}
  .ts-total.empty{font-size:11px}
}

.empty{
  text-align:center;padding:38px 20px;color:var(--faint);font-size:13.5px;
  background:#fff;border:1px dashed var(--line);border-radius:16px;
}
.empty svg{width:34px;height:34px;color:#d8dbea;margin-bottom:8px}

.hint-foot{text-align:center;color:#b6bacb;font-size:11.5px;margin-top:18px;line-height:1.6}

/* ============ 看板 ============ */
.board-grid{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
@media(min-width:1024px){.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}}

.chart-card{margin-bottom:20px}
.card-title{margin:0 0 4px;font-size:15px;font-weight:700}
.card-sub{margin:0 0 12px;font-size:12px;color:var(--faint)}
.chart-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

.bg-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;flex-wrap:nowrap}
.bg-head h3{margin:0;font-size:15.5px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{font-size:11px;background:#f3f4f9;color:var(--muted);padding:2.5px 8px;border-radius:99px;font-weight:600;flex:0 0 auto}

.bg-body{display:flex;align-items:center;gap:16px;margin-bottom:13px}
.ring{width:88px;height:88px;flex:0 0 auto}
.bg-stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:9px;min-width:0}
.bg-stats>div{background:#f8f9fd;border-radius:10px;padding:8px 10px;min-width:0}
.bg-stats b{display:block;font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg-stats span{font-size:11px;color:var(--faint)}

/* ===== 最近记录（按周折叠） ===== */
.rec-list{margin-top:13px;border-top:1px dashed var(--line);padding-top:11px}
.rec-title{font-size:12px;color:var(--faint);margin-bottom:7px;display:flex;justify-content:space-between}
.rec{
  display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:12.5px;
  border-bottom:1px solid #f4f5fa;
}
.rec:last-child{border-bottom:none}
.rec-date{
  color:var(--faint);flex:0 0 42px;
  font-variant-numeric:tabular-nums;padding-top:1px;
}
.rec-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rec-amt{
  font-weight:600;color:#1e2233;font-size:12.5px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}
.rec-amt .rec-arrow{color:#c3c7d6;font-weight:400;font-size:12px}
.rec-amt .rec-plus{color:#059669;font-weight:700}
.rec-meta{
  color:#6b7280;font-size:12px;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums;
}
.rec-meta .rec-time{color:#6d28d9;font-weight:600}
.rec-meta .rec-dot{color:#c3c7d6}
.rec-tag{
  font-size:10px;background:#ede9fe;color:#6d28d9;
  padding:1.5px 6px;border-radius:5px;font-weight:700;flex:0 0 auto;
}
.rec-acts{display:flex;gap:1px;flex:0 0 auto;align-self:flex-start}
.rec-del{
  width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:#c8ccda;flex:0 0 auto;transition:.15s;
}
.rec-del svg{width:13px;height:13px}
.rec-del:hover{background:#f3f4f9;color:var(--muted)}
.rec-del.danger:hover{background:#fef2f2;color:var(--red)}

/* ===== 疑问 / 复述 / 记录 折叠块 ===== */
.q-list{margin-top:13px;border-top:1px dashed var(--line);padding-top:11px}
.fold-block{
  margin-top:8px;
  border-radius:10px;
  background:#fbfbfe;
  border:1px solid #f0f1f7;
  overflow:hidden;
}
.fold-block > summary{
  list-style:none;
  cursor:pointer;
  display:flex;align-items:center;gap:8px;
  padding:9px 11px;
  font-size:12.5px;font-weight:700;color:#6b7280;
  user-select:none;
  transition:background .15s;
}
.fold-block > summary::-webkit-details-marker{display:none}
.fold-block > summary::after{
  content:'';
  width:8px;height:8px;flex:0 0 auto;
  border-right:1.5px solid #9aa0b4;
  border-bottom:1.5px solid #9aa0b4;
  transform:rotate(45deg);
  transition:transform .2s;
  margin-left:auto;
  margin-top:-3px;
}
.fold-block:not([open]) > summary::after{transform:rotate(-45deg);margin-top:0}
.fold-block > summary:hover{background:#f5f4fe}
.fold-label{color:#6b7280}
.fold-count{
  font-size:11px;font-weight:700;
  padding:1.5px 8px;border-radius:99px;
  background:#ede9fe;color:#6d28d9;
}
.fold-block.q-fold .fold-count{background:#ede9fe;color:#6d28d9}
.fold-block.s-fold .fold-count{background:#dbeafe;color:#1d4ed8}
.fold-block.r-fold .fold-count{background:#dcfce7;color:#15803d}
.fold-content{
  padding:4px 11px 10px;
  display:flex;flex-direction:column;gap:7px;
}
.q-item{
  display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:10px;
  background:#fff;border:1px solid #f0f1f7;
}
.q-item.done{opacity:.66}
.q-dot{
  width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px;
  background:var(--amber);
}
.q-item.done .q-dot{background:var(--green)}
.q-body{flex:1;min-width:0}
.q-text{font-size:12.5px;line-height:1.58;color:#3d4258;word-break:break-word}
.q-ans{
  font-size:12px;line-height:1.58;color:#047857;margin-top:6px;
  padding-left:9px;border-left:2px solid #a7f3d0;word-break:break-word;
}
.q-meta{font-size:11px;color:var(--faint);margin-top:5px}
.q-acts{display:flex;gap:2px;flex:0 0 auto}
.q-item.s-item{background:#fbfaff;border-color:#e9e4fb}
.q-item.s-item .q-text{color:#4b5163}

/* ============ 周报 ============ */
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.week-nav .wn-label{flex:1;text-align:center;font-weight:700;font-size:14.5px}
.week-nav .wn-label small{display:block;font-weight:400;color:var(--faint);font-size:11.5px;margin-top:1px}
.week-nav button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto;
}
.week-nav button svg{width:16px;height:16px}
.week-nav button:disabled{opacity:.35;cursor:not-allowed}

.wk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.wk-stat{background:#f8f9fd;border-radius:11px;padding:10px 11px;text-align:center}
.wk-stat b{display:block;font-size:18px;font-weight:700;letter-spacing:-.5px}
.wk-stat span{font-size:11px;color:var(--faint);display:block}
.wk-stat em{font-style:normal;font-size:11px;font-weight:600;display:inline-block;margin-top:3px;padding:1px 7px;border-radius:99px}
.wk-stat em.up{background:#ecfdf5;color:#059669}
.wk-stat em.down{background:#fef2f2;color:#dc2626}
.wk-stat em.flat{background:#f3f4f9;color:#6b7280}

.wk-table{width:100%;border-collapse:collapse;font-size:12.5px}
.wk-table th{
  text-align:left;font-weight:600;color:var(--faint);font-size:11.5px;
  padding:0 6px 8px;border-bottom:1px solid var(--line);
}
.wk-table td{padding:9px 6px;border-bottom:1px solid #f4f5fa;vertical-align:middle}
.wk-table tr:last-child td{border-bottom:none}
.wk-table td:first-child{font-weight:600}
.wk-table em{font-style:normal;font-size:11px;font-weight:600;margin-left:4px}
.wk-table em.up{color:#059669}
.wk-table em.down{color:#dc2626}
.wk-table em.flat{color:#9aa0b4}

.day-strip{display:flex;gap:5px;margin:16px 0 4px}
.day-cell{
  flex:1;min-width:0;
  border-radius:10px;
  padding:7px 2px 6px;
  text-align:center;
  background:#f8f9fd;
  border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.day-cell.has{background:linear-gradient(180deg,#f5f3ff,#ede9fe);border-color:#ddd6fe}
.day-cell.today{
  border-color:#7c3aed;
  background:linear-gradient(180deg,#faf5ff,#f3e8ff);
  box-shadow:0 0 0 1px rgba(124,58,237,.18);
}
.day-cell .dc-date{
  font-size:10px;
  color:#9aa0b4;
  font-weight:600;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.1px;
}
.day-cell .dc-d{
  font-size:11px;
  color:var(--faint);
  line-height:1.2;
  font-weight:600;
}
.day-cell .dc-v{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-top:1px;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
}
.day-cell.has .dc-v{color:#6d28d9}

.day-cell.sat .dc-d,
.day-cell.sat .dc-date{color:#d97706}
.day-cell.sat .dc-d{font-weight:700}
.day-cell.sun .dc-d,
.day-cell.sun .dc-date{color:#dc2626}
.day-cell.sun .dc-d{font-weight:700}
.day-cell.holiday .dc-d,
.day-cell.holiday .dc-date{color:#dc2626}
.day-cell.holiday .dc-d{font-weight:700}

.dc-badge{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9.5px;
  font-weight:700;
  line-height:1;
  padding:2.5px 6px;
  border-radius:5px;
  background:#fef3c7;
  color:#b45309;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  margin:1px 0;
}
.dc-badge.holiday{background:#fee2e2;color:#b91c1c}
.dc-badge-empty{height:14px;margin:1px 0}

.note-grid{display:grid;gap:12px}
@media(min-width:768px){.note-grid{grid-template-columns:1fr 1fr}}
.note-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.note-field textarea{
  width:100%;min-height:78px;resize:vertical;border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.6;background:#fff;
}
.note-field textarea:focus{outline:none;border-color:var(--purple-l);box-shadow:0 0 0 3px rgba(167,139,250,.18)}

.report-out{
  width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;
  padding:13px;font-size:13px;line-height:1.7;background:#fbfbfe;white-space:pre-wrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;
}

/* ============ 我的 ============ */
.me-list{display:flex;flex-direction:column;gap:11px}
.me-item{
  display:flex;align-items:center;gap:13px;padding:14px 15px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 2px rgba(24,26,52,.035);
}
.me-item .mi-ico{
  width:36px;height:36px;border-radius:11px;background:#f5f3ff;color:var(--purple);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.me-item .mi-ico svg{width:18px;height:18px}
.me-item .mi-ico.red{background:#fef2f2;color:var(--red)}
.me-item .mi-ico.amber{background:#fffbeb;color:var(--amber)}
.me-item .mi-body{flex:1;min-width:0}
.me-item .mi-title{font-weight:600;font-size:14px}
.me-item .mi-desc{font-size:12px;color:var(--faint);line-height:1.5;margin-top:1px}
.steps{counter-reset:s;padding:0;margin:10px 0 0;list-style:none}
.steps li{
  counter-increment:s;position:relative;padding-left:32px;margin-bottom:11px;
  font-size:13.5px;line-height:1.6;color:#3d4258;
}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:21px;height:21px;border-radius:7px;background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}

/* ============ 弹窗 ============ */
.modal-backdrop{
  position:fixed;inset:0;z-index:200;background:rgba(24,26,52,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fadeIn .16s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .24s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
@media(min-width:640px){
  .modal-backdrop{align-items:center;padding:20px}
  .modal{border-radius:20px;padding:24px;max-height:86vh}
}
.modal h2{margin:0 0 16px;font-size:18px;font-weight:700}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field .inp,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;
  font-size:14px;background:#fff;transition:.15s;
}
.field textarea{min-height:66px;resize:vertical;line-height:1.6}
.field .inp:focus,.field textarea:focus{outline:none;border-color:var(--purple-l);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.color-row{display:flex;gap:9px;flex-wrap:wrap}
.color-swatch{
  width:32px;height:32px;border-radius:10px;border:2px solid transparent;
  transition:.15s;position:relative;
}
.color-swatch.on{border-color:#1e2233;transform:scale(1.06)}
.color-swatch.on::after{
  content:"";position:absolute;inset:0;border-radius:8px;
  box-shadow:inset 0 0 0 2px #fff;
}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:0}
.modal-actions .btn.danger{flex:0 0 auto;padding:9px 14px}
.modal-hint{
  margin:-8px 0 16px;font-size:12.5px;color:#9aa0b4;line-height:1.62;
  background:#f8f9fd;border-radius:10px;padding:10px 12px;
}

.cat-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cat-pick button{
  padding:4px 10px;border-radius:99px;
  border:1px solid var(--line);background:#fbfbfe;
  color:var(--muted);font-size:12px;font-weight:600;
  transition:.15s;cursor:pointer;
}
.cat-pick button:hover{border-color:#ddd6fe;color:#6d28d9;background:#faf8ff}

/* ============ Toast ============ */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);
  background:rgba(30,34,51,.94);color:#fff;font-size:13.5px;font-weight:500;
  padding:10px 18px;border-radius:12px;z-index:300;opacity:0;pointer-events:none;
  transition:.24s cubic-bezier(.2,.8,.3,1);white-space:nowrap;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.4);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

function hmToMin(s) {
  const m = String(s || '').match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const h = Number(m[1]), mi = Number(m[2]);
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}
function normTime(v) {
  const t = hmToMin(v);
  if (t == null) return '';
  return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
}
function segMinutes(start, end) {
  const a = hmToMin(start), b = hmToMin(end);
  if (a == null || b == null) return 0;
  let e = b;
  if (e < a) e += 1440;
  return e - a;
}

/* =========================================================
   按周分组
   ========================================================= */
function groupByWeek(items, getDateKey) {
  const map = new Map();
  for (const it of items) {
    const dk = getDateKey(it);
    const mon = startOfWeek(parseKey(dk));
    const key = toKey(mon);
    if (!map.has(key)) map.set(key, { mon: mon, items: [] });
    map.get(key).items.push(it);
  }
  const arr = Array.from(map.values());
  arr.sort((a, b) => b.mon.getTime() - a.mon.getTime());
  return arr;
}
function weekGroupLabel(mon) {
  const sun = addDays(mon, 6);
  const thisMon = startOfWeek(new Date());
  const prefix = toKey(mon) === toKey(thisMon) ? '本周 · ' : '';
  return prefix + fmtMD(mon) + ' – ' + fmtMD(sun);
}

/* =========================================================
   数据迁移
   ========================================================= */
function migrate(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const out = { version: 2, goals: [], weekNotes: raw.weekNotes || raw.notes || {} };
  const srcGoals = raw.goals || raw.targets || raw.items || [];
  if (!Array.isArray(srcGoals)) return null;

  out.goals = srcGoals.map(g => {
    const recs = g.records || g.checkins || g.logs || g.history || [];
    const qs = g.questions || g.queries || [];
    return {
      id: g.id || uid(),
      name: g.name || g.title || '未命名目标',
      unit: g.unit || '个',
      total: Number(g.total || g.target || g.goal || 100) || 100,
      deadline: g.deadline || g.due || g.endDate || toKey(addDays(new Date(), 30)),
      color: g.color || g.colour || PALETTE[0],
      category: String(g.category || g.cat || '').trim(),
      obstacle: g.obstacle || g.blocker || '',
      plan: g.plan || g.ifThen || g.strategy || '',
      createdAt: g.createdAt || g.created || todayKey(),
      questions: (Array.isArray(qs) ? qs : []).map(q => ({
        id: q.id || uid(),
        date: q.date || todayKey(),
        text: q.text || q.content || q.question || '',
        answer: q.answer || q.solution || '',
        resolved: !!(q.resolved || q.done || q.solved),
        createdAt: q.createdAt || Date.now()
      })).filter(q => q.text),
      summaries: (g.summaries && typeof g.summaries === 'object') ? Object.assign({}, g.summaries) : {},
      reviews: (g.reviews && typeof g.reviews === 'object') ? Object.assign({}, g.reviews) : {},
      records: (Array.isArray(recs) ? recs : []).map(r => {
        if (typeof r === 'number') {
          return {
            id: uid(), date: todayKey(), amount: r,
            amountSegments: [{ from: 0, to: r, amount: r }],
            minutes: null, segments: [], backfill: false, createdAt: Date.now()
          };
        }
        const segs = Array.isArray(r.segments) ? r.segments.map(s => ({
          start: normTime(s.start), end: normTime(s.end),
          minutes: (Number(s.minutes) || segMinutes(s.start, s.end) || 0)
        })).filter(s => s.start && s.end) : [];
        const aSegs = Array.isArray(r.amountSegments) ? r.amountSegments.map(s => ({
          from: Number(s.from) || 0, to: Number(s.to) || 0,
          amount: Number(s.amount) || (Number(s.to) - Number(s.from)) || 0
        })).filter(s => s.amount > 0) : [];
        const amt = Number(r.amount != null ? r.amount : (r.value != null ? r.value : r.count)) || 0;
        return {
          id: r.id || uid(),
          date: r.date || r.day || todayKey(),
          amount: amt,
          amountSegments: aSegs.length ? aSegs : (amt > 0 ? [{ from: 0, to: amt, amount: amt }] : []),
          minutes: (r.minutes == null || r.minutes === '') ? (segs.length ? segs.reduce((a, b) => a + b.minutes, 0) : null) : Number(r.minutes),
          segments: segs,
          backfill: !!(r.backfill || r.back),
          createdAt: r.createdAt || Date.now()
        };
      })
    };
  });
  if (!out.goals.length) return null;
  return out;
}

/* =========================================================
   核心计算
   ========================================================= */
function computeStats(g) {
  const today = new Date();
  const dateSet = new Set(g.records.map(r => r.date));

  const doneAmount = g.records.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const total = Number(g.total) || 0;
  const remaining = Math.max(0, total - doneAmount);
  const rate = total > 0 ? Math.min(1, doneAmount / total) : 0;

  const dl = parseKey(g.deadline);
  const daysToDl = diffDays(dl, today);
  const overdueDays = daysToDl < 0 ? -daysToDl : 0;
  const daysRemaining = Math.max(1, daysToDl + 1);
  const suggested = remaining > 0 ? Math.ceil(remaining / daysRemaining) : 0;

  let streak = 0;
  const usedWeeks = new Set();
  const restDates = new Set();
  let cursor = today;
  const LIMIT = 240;
  for (let i = 0; i < LIMIT; i++) {
    const k = toKey(cursor);
    if (dateSet.has(k)) {
      streak++;
    } else {
      if (i > 0) {
        const wk = toKey(startOfWeek(cursor));
        if (!usedWeeks.has(wk)) {
          usedWeeks.add(wk);
          restDates.add(k);
        } else {
          break;
        }
      }
    }
    cursor = addDays(cursor, -1);
  }

  let yesterday = 'ok';
  const yk = toKey(addDays(today, -1));
  const created = g.createdAt ? parseKey(g.createdAt) : null;
  const goalExistedYesterday = created ? diffDays(created, addDays(today, -1)) <= 0 : true;
  if (goalExistedYesterday && !dateSet.has(yk)) {
    if (restDates.has(yk)) yesterday = 'yellow';
    else yesterday = 'red';
  }

  const windowStart = addDays(today, -6);
  const recent = g.records.filter(r => {
    const d = parseKey(r.date);
    return dayIndex(d) >= dayIndex(windowStart) && dayIndex(d) <= dayIndex(today);
  });
  const daysWithData = new Set(recent.map(r => r.date)).size;
  const recentAmount = recent.reduce((s, r) => s + (Number(r.amount) || 0), 0);

  let forecast = null;
  if (remaining <= 0) {
    forecast = { done: true };
  } else if (daysWithData >= 2 && recentAmount > 0) {
    const speed = recentAmount / 7;
    const daysNeeded = Math.ceil(remaining / speed);
    const eta = addDays(today, daysNeeded);
    forecast = { eta, daysNeeded, speed, delta: diffDays(eta, dl) };
  }

  return {
    doneAmount, total, remaining, rate,
    daysToDl, daysRemaining, overdueDays,
    suggested, streak, restDates, yesterday, forecast,
    isDone: remaining <= 0
  };
}

/* =========================================================
   抗遗忘复习
   ========================================================= */
function getDueReviews() {
  const today = new Date();
  const tIdx = dayIndex(today);
  const out = [];
  for (const g of state.goals) {
    const dateSet = new Set(g.records.map(r => r.date));
    for (const dk of dateSet) {
      const off = tIdx - dayIndex(parseKey(dk));
      if (off <= 0) continue;
      if (REVIEW_INTERVALS.indexOf(off) === -1) continue;
      const done = (g.reviews && g.reviews[dk]) || [];
      if (done.indexOf(off) !== -1) continue;
      const amt = g.records.filter(r => r.date === dk).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      out.push({
        goalId: g.id, goalName: g.name, color: g.color, unit: g.unit,
        date: dk, offset: off,
        summary: (g.summaries && g.summaries[dk]) || '',
        amount: amt
      });
    }
  }
  out.sort((a, b) => a.offset - b.offset);
  return out;
}

function todayHTML() {
  const today = new Date();
  let html = '';

  html += '<div class="page-head"><div><h1>今日</h1>' +
    '<p class="sub">' + today.getFullYear() + '年' + fmtMD(today) + ' · 星期' + WD[today.getDay()] + '</p></div>' +
    '<button class="btn primary" data-action="new-goal" style="flex:0 0 auto">' + I.plus + '新建目标</button></div>';

  html += reminderBannerHTML();
  html += categoryFilterBarHTML();

  const n = totalRecordCount();
  if (n >= 20) html += backupBannerHTML(n);

  html += reviewSectionHTML();

  const visibleGoals = state.goals.filter(matchFilter);

  const urgent = [], normal = [];
  for (const g of visibleGoals) {
    const st = computeStats(g);
    if (st.isDone) { normal.push({ g, st }); continue; }
    if (st.overdueDays > 0) urgent.push({ g, st, kind: 'overdue' });
    else if (st.yesterday === 'yellow') urgent.push({ g, st, kind: 'rest' });
    else if (st.yesterday === 'red') urgent.push({ g, st, kind: 'missed' });
    else normal.push({ g, st });
  }
  urgent.sort((a, b) => {
    const rank = k => k === 'overdue' ? 0 : (k === 'missed' ? 1 : 2);
    return rank(a.kind) - rank(b.kind);
  });

  if (!visibleGoals.length) {
    if (state.goals.length === 0) {
      html += '<section class="section"><div class="goal-list">' + emptyHTML() + '</div></section>';
    } else {
      html += '<div class="empty">' + I.tag +
        '<div>该分类下暂无目标<br>换个分类看看，或者给目标补一个分类标签</div></div>';
    }
  } else {
    if (urgent.length) {
      html += '<section class="section"><h2 class="section-title">' + I.alert + '今天要处理</h2>' +
        '<div class="goal-list">' + urgent.map(u => goalCardHTML(u.g, u.st, u.kind)).join('') + '</div></section>';
    }

    html += '<section class="section"><h2 class="section-title">' + I.check + '今日打卡</h2>' +
      '<div class="goal-list">' +
      (normal.length ? normal.map(u => goalCardHTML(u.g, u.st, null)).join('') : emptyHTML()) +
      '</div></section>';
  }

  html += '<button class="btn primary big block" data-action="new-goal">' + I.plus + '新建一个目标</button>';
  html += '<div class="hint-foot">所有数据只保存在这台设备的浏览器里，不会上传到任何服务器。</div>';
  return html;
}

function readAmtRowsFrom(box) {
  if (!box) return [];
  return Array.prototype.slice.call(box.querySelectorAll('.as-row')).map(row => {
    const f = row.querySelector('.as-from');
    const t = row.querySelector('.as-to');
    return { from: f ? f.value : '', to: t ? t.value : '' };
  });
}

function calcAmtSegs(rows) {
  return rows.map(r => {
    if (r.from === '' || r.to === '' || r.from == null || r.to == null) return null;
    const f = Number(r.from), t = Number(r.to);
    if (isNaN(f) || isNaN(t) || t <= f) return null;
    return { from: f, to: t, amount: t - f };
  }).filter(Boolean);
}

function refreshAmtBox(box, unit) {
  if (!box) return 0;
  const u = unit || box.dataset.unit || '个';
  const rows = box.querySelectorAll('.as-row');
  let total = 0;
  Array.prototype.forEach.call(rows, row => {
    const f = row.querySelector('.as-from');
    const t = row.querySelector('.as-to');
    const lbl = row.querySelector('.as-sum');
    const fv = f && f.value !== '' ? Number(f.value) : null;
    const tv = t && t.value !== '' ? Number(t.value) : null;
    let n = 0;
    if (fv !== null && tv !== null && !isNaN(fv) && !isNaN(tv) && tv >= fv) n = tv - fv;
    if (lbl) {
      lbl.textContent = n > 0 ? n + ' ' + u : '—';
      lbl.classList.toggle('empty', n <= 0);
    }
    total += n;
  });
  const el = box.querySelector('[data-amt-total]');
  if (el) {
    el.textContent = total > 0 ? '本次 ' + total + ' ' + u : '未填写';
    el.classList.toggle('empty', total <= 0);
  }
  return total;
}

function syncAmtUI(id, card) {
  const u = getUI(id);
  const box = card.querySelector('.amount-seg-box');
  u.amtSegs = readAmtRowsFrom(box);
}

function addAmtRowToBox(box) {
  if (!box) return null;
  const list = box.querySelector('.as-list');
  if (!list) return null;
  const unit = box.dataset.unit || '个';
  const row = document.createElement('div');
  row.className = 'as-row';
  row.innerHTML = amtRowHTML('', '', unit);
  list.appendChild(row);
  refreshAmtBox(box, unit);
  const card = box.closest('.goal-card');
  if (card && card.dataset.id) {
    syncAmtUI(card.dataset.id, card);
    refreshGoalProgress(card);
  }
  return row;
}

function delAmtRow(row) {
  if (!row) return;
  const box = row.closest('.amount-seg-box');
  if (!box) return;
  const list = box.querySelector('.as-list');
  const unit = box.dataset.unit || '个';
  row.parentNode.removeChild(row);
  if (list && !list.querySelector('.as-row')) {
    const nr = document.createElement('div');
    nr.className = 'as-row';
    nr.innerHTML = amtRowHTML('', '', unit);
    list.appendChild(nr);
  }
  refreshAmtBox(box, unit);
  const card = box.closest('.goal-card');
  if (card && card.dataset.id) {
    syncAmtUI(card.dataset.id, card);
    refreshGoalProgress(card);
  }
}

/* =========================================================
   时间段
   ========================================================= */
function tsRowHTML(start, end) {
  const s = normTime(start), e = normTime(end);
  const m = (s && e) ? segMinutes(s, e) : 0;
  return '<input type="time" class="ts-start" value="' + esc(s) + '" step="60">' +
    '<span class="ts-sep">—</span>' +
    '<input type="time" class="ts-end" value="' + esc(e) + '" step="60">' +
    '<span class="ts-min' + (m > 0 ? '' : ' empty') + '">' + (m > 0 ? m + '′' : '—') + '</span>' +
    '<button type="button" class="ts-del" data-action="ts-del" title="删除这一段">' + I.x + '</button>';
}

function timeSegBoxHTML(g, opts) {
  const o = opts || {};
  const u = o.segments ? null : getUI(g.id);
  const segs = o.segments && o.segments.length
    ? o.segments
    : ((u && u.segments && u.segments.length) ? u.segments : [{ start: '', end: '' }]);

  const rows = segs.map(s => '<div class="ts-row">' + tsRowHTML(s.start, s.end) + '</div>').join('');
  const initTotal = segs.reduce((a, s) => {
    const m = (normTime(s.start) && normTime(s.end)) ? segMinutes(s.start, s.end) : 0;
    return a + m;
  }, 0);

  return '<div class="time-seg-box">' +
    '<div class="ts-head">' +
    '<span class="ts-lbl">' + I.clock + '投入时间统计：开始时间到结束时间</span>' +
    '<span class="ts-total' + (initTotal > 0 ? '' : ' empty') + '" data-total>' +
    (initTotal > 0 ? '合计 ' + initTotal + ' 分钟' : '未填写') + '</span>' +
    '</div>' +
    '<div class="ts-list">' + rows + '</div>' +
    '<button type="button" class="ts-add" data-action="ts-add">' + I.plus + '添加时间段</button>' +
    '</div>';
}

function readSegRowsFrom(container) {
  if (!container) return [];
  return Array.prototype.slice.call(container.querySelectorAll('.ts-row')).map(row => {
    const s = row.querySelector('.ts-start');
    const e = row.querySelector('.ts-end');
    return { start: s ? s.value : '', end: e ? e.value : '' };
  });
}

function calcSegs(rows) {
  return rows
    .map(r => ({ start: normTime(r.start), end: normTime(r.end) }))
    .filter(r => r.start && r.end)
    .map(r => ({ start: r.start, end: r.end, minutes: segMinutes(r.start, r.end) }))
    .filter(s => s.minutes > 0);
}

function refreshSegBox(box) {
  if (!box) return;
  const rows = box.querySelectorAll('.ts-row');
  let total = 0;
  Array.prototype.forEach.call(rows, row => {
    const s = row.querySelector('.ts-start');
    const e = row.querySelector('.ts-end');
    const label = row.querySelector('.ts-min');
    const sv = s ? normTime(s.value) : '';
    const ev = e ? normTime(e.value) : '';
    const m = (sv && ev) ? segMinutes(sv, ev) : 0;
    if (label) {
      label.textContent = m > 0 ? m + '′' : '—';
      label.classList.toggle('empty', m <= 0);
    }
    total += m;
  });
  const tEl = box.querySelector('[data-total]');
  if (tEl) {
    tEl.textContent = total > 0 ? '合计 ' + total + ' 分钟' : '未填写';
    tEl.classList.toggle('empty', total <= 0);
  }
}

function syncSegUI(id, card) {
  const u = getUI(id);
  u.segments = readSegRowsFrom(card);
}

function addSegRowToBox(box) {
  if (!box) return null;
  const list = box.querySelector('.ts-list');
  if (!list) return null;
  const rows = list.querySelectorAll('.ts-row');
  const last = rows.length ? rows[rows.length - 1] : null;
  const lastEnd = last ? normTime((last.querySelector('.ts-end') || {}).value || '') : '';
  const row = document.createElement('div');
  row.className = 'ts-row';
  row.innerHTML = tsRowHTML(lastEnd, '');
  list.appendChild(row);
  refreshSegBox(box);
  const card = box.closest('.goal-card');
  if (card && card.dataset.id) syncSegUI(card.dataset.id, card);
  return row;
}

function delSegRow(row) {
  if (!row) return;
  const box = row.closest('.time-seg-box');
  if (!box) return;
  const list = box.querySelector('.ts-list');
  row.parentNode.removeChild(row);
  if (list && !list.querySelector('.ts-row')) {
    const nr = document.createElement('div');
    nr.className = 'ts-row';
    nr.innerHTML = tsRowHTML('', '');
    list.appendChild(nr);
  }
  refreshSegBox(box);
  const card = box.closest('.goal-card');
  if (card && card.dataset.id) syncSegUI(card.dataset.id, card);
}

/* =========================================================
   今日建议进度
   ========================================================= */
function refreshGoalProgress(card) {
  const box = card.querySelector('[data-goalprog]');
  if (!box) return;
  const id = card.dataset.id;
  const g = state.goals.find(x => x.id === id);
  if (!g) return;

  const suggested = Number(box.dataset.suggested) || 0;
  const unit = box.dataset.unit || g.unit;

  if (suggested <= 0) {
    const lbl = box.querySelector('.gp-lbl');
    const st = box.querySelector('.gp-status');
    const bar = box.querySelector('.gp-bar');
    if (lbl) lbl.innerHTML = '目标总量已完成，继续记录也行';
    if (st) { st.textContent = ''; st.className = 'gp-status'; }
    if (bar) bar.classList.add('hidden');
    return;
  }

  const todayK = todayKey();
  const doneToday = g.records
    .filter(r => r.date === todayK)
    .reduce((s, r) => s + (Number(r.amount) || 0), 0);

  const amtBox = card.querySelector('.amount-seg-box');
  const inputNow = calcAmtSegs(readAmtRowsFrom(amtBox)).reduce((a, b) => a + b.amount, 0);

  const total = doneToday + inputNow;
  const pct = Math.min(100, (total / suggested) * 100);

  const fill = box.querySelector('.gp-fill');
  const status = box.querySelector('.gp-status');
  const lbl = box.querySelector('.gp-lbl');

  if (fill) {
    fill.style.width = pct + '%';
    fill.className = 'gp-fill' + (total > suggested ? ' over' : (total >= suggested ? ' ok' : ''));
  }
  if (lbl) {
    lbl.innerHTML = '今日已 ' + num(total) + ' / 建议 <b>' + num(suggested) + '</b> ' + esc(unit);
  }

  let txt = '', cls = 'short';
  if (total > suggested) { txt = '超出期望 +' + num(total - suggested); cls = 'over'; }
  else if (total >= suggested) { txt = '达成'; cls = 'ok'; }
  else { txt = '还差 ' + num(suggested - total); cls = 'short'; }

  if (status) {
    status.textContent = txt;
    status.className = 'gp-status ' + cls;
  }
}

function goalProgressHTML(g, st) {
  return '<div class="goal-progress" data-goalprog data-suggested="' + st.suggested + '" data-unit="' + esc(g.unit) + '">' +
    '<div class="gp-top">' +
    '<span class="gp-lbl">今日已 0 / 建议 <b>' + num(st.suggested) + '</b> ' + esc(g.unit) + '</span>' +
    '<span class="gp-status short">还差 ' + num(st.suggested) + '</span>' +
    '</div>' +
    '<div class="gp-bar"><div class="gp-fill"></div></div>' +
    '</div>';
}

/* =========================================================
   目标卡
   ========================================================= */
function goalCardHTML(g, st, urgentKind) {
  const u = getUI(g);
  const pct = Math.round(st.rate * 1000) / 10;

  let etaHTML = '<span class="stat-v" style="color:#9aa0b4">暂无推算</span>';
  if (st.isDone) {
    etaHTML = '<span class="stat-v good">已完成</span>';
  } else if (st.forecast && st.forecast.eta) {
    const f = st.forecast;
    let cmp = '', cls = '';
    if (f.delta < 0) { cmp = '提前' + (-f.delta) + '天'; cls = 'good'; }
    else if (f.delta > 0) { cmp = '拖后' + f.delta + '天'; cls = 'bad'; }
    else { cmp = '正好卡点'; cls = ''; }
    etaHTML = '<span class="stat-v ' + cls + '">' + fmtMDs(f.eta) + '<small style="font-size:10.5px;font-weight:600;margin-left:3px;opacity:.85">' + cmp + '</small></span>';
  }

  const deadlineStr = fmtMD(parseKey(g.deadline));
  const overdueTag = st.overdueDays > 0 ? ' · <span style="color:#ef4444;font-weight:600">已逾期' + st.overdueDays + '天</span>' : '';

  const planHTML = (g.obstacle || g.plan) ?
    '<div class="plan-box">' +
    (g.obstacle ? '<div class="pl ob">' + I.obstacle + '<div><b>障碍：</b>' + esc(g.obstacle) + '</div></div>' : '') +
    (g.plan ? '<div class="pl">' + I.plan + '<div><b>如果它出现，我就：</b>' + esc(g.plan) + '</div></div>' : '') +
    '</div>' : '';

  const openQs = (g.questions || []).filter(q => !q.resolved).length;
  const summaries = g.summaries || {};
  const hasSummaryToday = !!summaries[todayKey()];
  const noteBarHTML =
    '<div class="note-bar">' +
    '<button class="note-btn" data-action="add-question" data-id="' + g.id + '">' +
    I.question + '记疑问' + (openQs ? '<span class="badge">' + openQs + '</span>' : '') +
    '</button>' +
    '<button class="note-btn" data-action="add-summary" data-id="' + g.id + '">' +
    I.summary + (hasSummaryToday ? '改复述' : '复述总结') +
    '</button>' +
    '</div>';

  const todayK = todayKey();
  const hasToday = g.records.some(r => r.date === todayK);
  const isPending = !st.isDone && !hasToday;

  const catHTML = g.category ? catChipHTML(g.category) : '';

  return '<article class="card goal-card' + (isPending ? ' pending' : '') + '" data-id="' + g.id + '" style="--gc:' + g.color + '">' +
    (urgentKind ? statusBannerHTML(urgentKind, st) : '') +
    '<div class="gc-top">' +
    '<span class="gc-dot"></span>' +
    '<h3 class="gc-name">' + esc(g.name) + '</h3>' +
    catHTML +
    '<div class="gc-actions">' +
    '<button class="icon-btn" data-action="edit" data-id="' + g.id + '" title="编辑目标">' + I.edit + '</button>' +
    '<button class="icon-btn danger" data-action="delete" data-id="' + g.id + '" title="删除目标">' + I.trash + '</button>' +
    '</div></div>' +

    '<div class="gc-stats">' +
    '<div class="stat"><span class="stat-v">' + pct + '%</span><span class="stat-l">完成率</span></div>' +
    '<div class="stat"><span class="stat-v">' + st.streak + ' 天</span><span class="stat-l">连续打卡</span></div>' +
    '<div class="stat">' + etaHTML + '<span class="stat-l">预计完成</span></div>' +
    '</div>' +

    '<div class="bar"><div class="fill" style="width:' + (st.rate * 100).toFixed(2) + '%"></div></div>' +
    '<div class="bar-meta">已完成 <b>' + num(st.doneAmount) + '</b> / ' + num(g.total) + ' ' + esc(g.unit) +
    ' · 剩余 <b>' + num(st.remaining) + '</b> ' + esc(g.unit) +
    ' · 截止 ' + deadlineStr + overdueTag + '</div>' +

    planHTML +
    noteBarHTML +

    '<div class="checkin">' +
    timeSegBoxHTML(g) +
    '<div class="checkin-row" style="margin-top:10px">' +
    '<select class="inp" data-role="date" data-id="' + g.id + '">' + dateOptionsHTML(u.date || todayKey()) + '</select>' +
    '</div>' +
    amountSegBoxHTML(g) +
    goalProgressHTML(g, st) +
    '<button class="btn primary block" style="margin-top:12px" data-action="checkin" data-id="' + g.id + '">' + I.check + '打卡</button>' +
    '</div>' +
    '</article>';
}

function getUI(id) {
  if (!ui[id]) ui[id] = { date: todayKey(), amtSegs: [], segments: [] };
  if (!ui[id].amtSegs) ui[id].amtSegs = [];
  if (!ui[id].segments) ui[id].segments = [];
  return ui[id];
}

/* =========================================================
   看板 Tab
   ========================================================= */
function ringSVG(rate, color) {
  const r = 38, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, rate)));
  return '<svg class="ring" viewBox="0 0 100 100">' +
    '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#eef0f7" stroke-width="9"/>' +
    '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" ' +
    'stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" ' +
    'transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)"/>' +
    '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#1e2233">' +
    Math.round(rate * 100) + '%</text></svg>';
}

    '<div class="legend">' + state.goals.map(g =>
      '<span><i style="background:' + g.color + '"></i>' + esc(g.name) + '</span>').join('') + '</div>' +

  const visibleGoals = state.goals.filter(matchFilter);

    }
  } else {

function questionItemHTML(g, q) {

    '<div class="q-body">' +
    '<div class="q-text">' + esc(q.text) + '</div>' +
    (q.answer ? '<div class="q-ans">' + esc(q.answer) + '</div>' : '') +
    '<div class="q-meta">' + fmtMD(parseKey(q.date)) + (q.resolved ? ' · 已解决' : ' · 待解决') + '</div>' +

function summaryItemHTML(g, dk, text) {
  return '<div class="q-item s-item">' +
    '<span class="q-dot" style="background:' + g.color + '"></span>' +
    '<div class="q-body">' +
    '<div class="q-meta" style="margin:0 0 5px">' + fmtMD(parseKey(dk)) + '</div>' +
    '<div class="q-text">' + esc(text) + '</div>' +

    '</div></div>';
}

function foldBlockHTML(kind, label, itemsHTML, count, unit) {
  if (!itemsHTML) return '';
  const foldCls = kind === 'q' ? 'q-fold' : (kind === 's' ? 's-fold' : 'r-fold');
  return '<details class="fold-block ' + foldCls + '">' +
    '<summary>' +
    '<span class="fold-label">' + esc(label) + '</span>' +
    '<span class="fold-count">' + count + ' ' + unit + '</span>' +
    '</summary>' +
    '<div class="fold-content">' + itemsHTML + '</div>' +
    '</details>';
}

/* ★ 疑问：按周折叠，显示总个数 */
function questionsHTML(g) {
  const qs = (g.questions || []).slice().sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
  if (!qs.length) return '';

  const openCount = qs.filter(q => !q.resolved).length;
  const groups = groupByWeek(qs, q => q.date);

  let html = '<div class="q-list">' +
    '<div class="rec-title"><span>疑问' +
    (openCount ? ' · ' + openCount + ' 个待解决' : '') + '</span><span>' + qs.length + ' 条</span></div>';

  for (const grp of groups) {
    const sortedItems = grp.items.slice().sort((a, b) => {
      if (a.resolved !== b.resolved) return a.resolved ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    const itemsHTML = sortedItems.map(q => questionItemHTML(g, q)).join('');
    html += foldBlockHTML('q', weekGroupLabel(grp.mon), itemsHTML, sortedItems.length, '条');
  }

  html += '</div>';
  return html;
}

/* ★ 复述：按周折叠，显示总个数 */
function summariesHTML(g) {
  const s = g.summaries || {};
  const keys = Object.keys(s).sort().reverse();
  if (!keys.length) return '';

  const items = keys.map(k => ({ date: k, text: s[k] }));
  const groups = groupByWeek(items, it => it.date);

  let html = '<div class="q-list">' +
    '<div class="rec-title"><span>复述总结</span><span>' + keys.length + ' 篇</span></div>';

  for (const grp of groups) {
    const itemsHTML = grp.items.map(it => summaryItemHTML(g, it.date, it.text)).join('');
    html += foldBlockHTML('s', weekGroupLabel(grp.mon), itemsHTML, grp.items.length, '篇');
  }

  html += '</div>';
  return html;
}

/* ★ 最近记录条目 */
function recItemHTML(g, r) {
  const d = parseKey(r.date);

  const aSegs = (r.amountSegments && r.amountSegments.length)
    ? r.amountSegments
    : (r.amount > 0 ? [{ from: 0, to: r.amount, amount: r.amount }] : []);

  let amtHTML = '<span>' + num(r.amount) + ' ' + esc(g.unit) + '</span>';
  if (aSegs.length) {
    const froms = aSegs.map(s => Number(s.from)).filter(v => !isNaN(v));
    const tos = aSegs.map(s => Number(s.to)).filter(v => !isNaN(v));
    if (froms.length && tos.length) {
      const minFrom = Math.min.apply(null, froms);
      const maxTo = Math.max.apply(null, tos);
      amtHTML =
        '<span>' + num(minFrom) + '</span>' +
        '<span class="rec-arrow">→</span>' +
        '<span>' + num(maxTo) + '</span>' +
        '<span class="rec-plus">+' + num(r.amount) + ' ' + esc(g.unit) + '</span>';
    }
  }

  const tSegs = r.segments || [];
  let metaHTML = '';
  if (tSegs.length) {
    const firstStart = tSegs[0].start;
    const lastEnd = tSegs[tSegs.length - 1].end;
    const parts = [];
    parts.push('<span class="rec-time">' + esc(firstStart) + '–' + esc(lastEnd) + '</span>');
    if (r.minutes != null) parts.push('<span>' + num(r.minutes) + ' 分钟</span>');
    if (tSegs.length > 1) parts.push('<span>' + tSegs.length + ' 段</span>');
    metaHTML = parts.join('<span class="rec-dot">·</span>');
  } else if (r.minutes != null) {
    metaHTML = '<span>' + num(r.minutes) + ' 分钟</span>';
  }

  return '<div class="rec">' +
    '<span class="rec-date">' + fmtMDs(d) + '</span>' +
    '<div class="rec-main">' +
    '<div class="rec-amt">' + amtHTML + (r.backfill ? '<span class="rec-tag">补</span>' : '') + '</div>' +
    (metaHTML ? '<div class="rec-meta">' + metaHTML + '</div>' : '') +
    '</div>' +
    '<div class="rec-acts">' +
    '<button class="rec-del" data-action="edit-rec" data-id="' + g.id + '" data-rec="' + r.id + '" title="编辑这条记录">' + I.edit + '</button>' +
    '<button class="rec-del danger" data-action="del-rec" data-id="' + g.id + '" data-rec="' + r.id + '" title="删除这条记录">' + I.x + '</button>' +
    '</div>' +
    '</div>';
}

/* ★ 最近记录：按周折叠，显示总个数 */
function recentRecordsHTML(g, recs) {
  if (!recs.length) {
    return '<div style="color:#b6bacb;font-size:12.5px;padding:6px 0">还没有记录</div>';
  }
  const groups = groupByWeek(recs, r => r.date);
  return groups.map(grp => {
    const sortedItems = grp.items.slice().sort((a, b) => {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    const itemsHTML = sortedItems.map(r => recItemHTML(g, r)).join('');
    return foldBlockHTML('r', weekGroupLabel(grp.mon), itemsHTML, sortedItems.length, '条');
  }).join('');
}

/* =========================================================
   SVG 图表
   ========================================================= */
function niceCeil(v) {
  if (v <= 10) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const nice = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return nice * mag;
}

function drawChart() {
  const svg = document.getElementById('minChart');
  if (!svg) return;
  const W = 720, H = 290;
  const padL = 48, padR = 14, padT = 16, padB = 62;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const today = new Date();

  const days = [];
  for (let i = 13; i >= 0; i--) days.push(addDays(today, -i));

  const visibleGoals = state.goals.filter(matchFilter);

  const data = days.map(d => {
    const k = toKey(d);
    const segs = visibleGoals.map(g => {
      const mins = g.records
        .filter(r => r.date === k && r.minutes != null && r.minutes !== '')
        .reduce((s, r) => s + (Number(r.minutes) || 0), 0);
      return { color: g.color, value: mins };
    }).filter(s => s.value > 0);
    return { k, date: d, segs, total: segs.reduce((s, x) => s + x.value, 0) };
  });

  const maxTotal = Math.max(1, ...data.map(d => d.total));
  const niceMax = niceCeil(maxTotal);

  let out = '';
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = niceMax * i / steps;
    const y = padT + plotH - (v / niceMax) * plotH;
    out += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="#eef0f7" stroke-width="1"/>';
    out += '<text x="' + (padL - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#9aa0b4">' + Math.round(v) + '</text>';
  }

  const bw = plotW / 14;
  const barW = Math.min(32, bw * 0.62);

  data.forEach((d, i) => {
    const cx = padL + bw * i + bw / 2;
    let y = padT + plotH;
    for (const s of d.segs) {
      const hgt = (s.value / niceMax) * plotH;
      y -= hgt;
      out += '<rect x="' + (cx - barW / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) +
        '" height="' + Math.max(hgt, 0.5).toFixed(1) + '" fill="' + s.color + '" rx="3"/>';
    }
    /* 日期 + 星期（带节假日标注） */
    if (i % 2 === 0 || i === 13) {
      const dow = d.date.getDay();
      const isSat = dow === 6;
      const isSun = dow === 0;
      const holiday = CN_HOLIDAYS[d.k] || '';
      let wkColor = '#9aa0b4';
      if (holiday) wkColor = '#dc2626';
      else if (isSun) wkColor = '#dc2626';
      else if (isSat) wkColor = '#d97706';
      const wkText = '周' + WD[dow];
      out += '<text x="' + cx.toFixed(1) + '" y="' + (padT + plotH + 15) + '" text-anchor="middle" font-size="10" fill="#9aa0b4">' + fmtMDs(d.date) + '</text>';
      out += '<text x="' + cx.toFixed(1) + '" y="' + (padT + plotH + 30) + '" text-anchor="middle" font-size="9.5" font-weight="600" fill="' + wkColor + '">' +
        (holiday ? '<title>' + esc(holiday) + '</title>' : '') + wkText + '</text>';
    }
  });

  if (!data.some(d => d.total > 0)) {
    out += '<text x="' + (W / 2) + '" y="' + (padT + plotH / 2) + '" text-anchor="middle" font-size="13" fill="#c3c7d6">还没有填过时间段的记录</text>';
  }

  svg.innerHTML = out;
}
