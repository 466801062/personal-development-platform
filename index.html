/* ★ 周一到周日：日期 + “周”字 + 休角标 + 周末颜色 + 节假日名称 */
function dayStripHTML(mon) {
  const today = new Date();
  const todayK = toKey(today);
  const cells = [];

  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const k = toKey(d);
    const dow = d.getDay();
    const isSat = dow === 6;
    const isSun = dow === 0;
    const holiday = CN_HOLIDAYS[k] || '';
    const isHoliday = !!holiday;
    const isRest = isSat || isSun || isHoliday;
    const isToday = k === todayK;

    const recs = state.goals.flatMap(g => g.records.filter(r => r.date === k));
    const min = recs.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
    const has = recs.length > 0;

    let cls = 'day-cell';
    if (has) cls += ' has';
    if (isToday) cls += ' today';
    if (isSat) cls += ' sat';
    if (isSun) cls += ' sun';
    if (isHoliday) cls += ' holiday';

    let badgeHTML = '';
    if (isHoliday) {
      badgeHTML = '<div class="dc-badge holiday" title="' + esc(holiday) + '">休 · ' + esc(holiday) + '</div>';
    } else if (isRest) {
      badgeHTML = '<div class="dc-badge">休</div>';
    } else {
      badgeHTML = '<div class="dc-badge-empty"></div>';
    }

    const v = has ? (min > 0 ? min + '′' : recs.length + '次') : '—';

    cells.push(
      '<div class="' + cls + '">' +
      '<div class="dc-date">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>' +
      '<div class="dc-d">周' + WD[dow] + '</div>' +
      badgeHTML +
      '<div class="dc-v">' + v + '</div>' +
      '</div>'
    );
  }

  return '<div class="day-strip">' + cells.join('') + '</div>';
}

function weeklyHTML() {
  const today = new Date();
  const thisMon = startOfWeek(today);
  const mon = addDays(thisMon, weekOffset * 7);
  const sun = addDays(mon, 6);
  const prevMon = addDays(mon, -7);

  const inRange = (g, s, e) => g.records.filter(r => {
    const d = parseKey(r.date);
    return dayIndex(d) >= dayIndex(s) && dayIndex(d) <= dayIndex(e);
  });

  const isThisWeek = weekOffset === 0;
  const label = isThisWeek ? '本周' : (weekOffset === -1 ? '上周' : Math.abs(weekOffset) + ' 周前');

  let totalCount = 0, totalMin = 0, prevCount = 0, prevMin = 0;
  const daysWith = new Set();
  const perGoal = [];

  for (const g of state.goals) {
    const cur = inRange(g, mon, sun);
    const prev = inRange(g, prevMon, addDays(prevMon, 6));
    const amt = cur.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const pAmt = prev.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const min = cur.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
    const pMin = prev.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
    const dset = new Set(cur.map(r => r.date));
    totalCount += cur.length;
    totalMin += min;
    prevCount += prev.length;
    prevMin += pMin;
    cur.forEach(r => daysWith.add(r.date));
    perGoal.push({ g, amt, pAmt, min, pMin, days: dset.size });
  }

  const pctDelta = (cur, prev) => {
    if (prev === 0 && cur === 0) return '<em class="flat">持平</em>';
    if (prev === 0) return '<em class="up">新增</em>';
    const d = cur - prev;
    if (d === 0) return '<em class="flat">持平</em>';
    return '<em class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + num(d) + '</em>';
  };

  let html = '<div class="page-head"><div><h1>周报</h1><p class="sub">周一到周日汇总 · 与上周同口径对比</p></div></div>';

  html += '<div class="card" style="margin-bottom:16px">' +
    '<div class="week-nav">' +
    '<button data-action="prev-week">' + I.left + '</button>' +
    '<div class="wn-label">' + fmtMD(mon) + ' — ' + fmtMD(sun) + '<small>' + label + '</small></div>' +
    '<button data-action="next-week"' + (weekOffset >= 0 ? ' disabled' : '') + '>' + I.right + '</button>' +
    '</div>' +

    '<div class="wk-grid">' +
    '<div class="wk-stat"><b>' + totalCount + '</b><span>打卡次数</span>' + pctDelta(totalCount, prevCount) + '</div>' +
    '<div class="wk-stat"><b>' + totalMin + '</b><span>投入分钟</span>' + pctDelta(totalMin, prevMin) + '</div>' +
    '<div class="wk-stat"><b>' + daysWith.size + '</b><span>打卡天数</span><em class="flat">/ 7 天</em></div>' +
    '</div>' +

    '<table class="wk-table"><thead><tr><th>目标</th><th>投入量</th><th>打卡天数</th><th>分钟</th></tr></thead><tbody>' +
    (perGoal.length ? perGoal.map(p =>
      '<tr><td>' + esc(p.g.name) + (p.g.category ? ' <span class="cat-chip" style="margin-left:4px;font-size:10px;padding:1.5px 6px;background:' + catColor(p.g.category).bg + ';color:' + catColor(p.g.category).fg + '">' + esc(p.g.category) + '</span>' : '') + '</td>' +
      '<td>' + num(p.amt) + ' ' + esc(p.g.unit) + ' ' + pctDelta(p.amt, p.pAmt) + '</td>' +
      '<td>' + p.days + ' 天</td>' +
      '<td>' + p.min + ' ' + pctDelta(p.min, p.pMin) + '</td></tr>'
    ).join('') : '<tr><td colspan="4" style="color:#b6bacb;padding:16px 6px">这一周还没有记录</td></tr>') +
    '</tbody></table>' +

    dayStripHTML(mon) +
    '</div>';

  const wkKey = weekNotesKey(mon);
  const notes = state.weekNotes[wkKey] || {};
  html += '<div class="card" style="margin-bottom:16px">' +
    '<h2 class="card-title" style="margin-bottom:12px">本周复盘</h2>' +
    '<div class="note-grid">' +
    noteField(wkKey, 'keep', '保持', notes.keep, '这周什么做法是有效的？') +
    noteField(wkKey, 'problem', '问题', notes.problem, '哪里卡住了？什么最耗心力？') +
    noteField(wkKey, 'try', '尝试', notes.try, '下周想试一个什么小改动？') +
    noteField(wkKey, 'next', '下周预案', notes.next, '如果障碍又出现，我打算怎么做？') +
    '</div></div>';

  html += '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">' +
    '<h2 class="card-title" style="margin:0">一键生成周报文本</h2>' +
    '<button class="btn primary" data-action="gen-report">' + I.plan + '生成</button></div>' +
    '<textarea class="report-out" id="reportOut" placeholder="点「生成」后，这里会出现可复制的周报文本。"></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:10px">' +
    '<button class="btn" data-action="copy-report" style="flex:1">复制文本</button>' +
    '</div></div>';

  return html;
}

function noteField(wkKey, key, label, val, ph) {
  return '<div class="note-field"><label>' + label + '</label>' +
    '<textarea placeholder="' + esc(ph) + '" data-note="' + key + '" data-week="' + wkKey + '">' + esc(val || '') + '</textarea></div>';
}

function buildWeeklyText() {
  const today = new Date();
  const thisMon = startOfWeek(today);
  const mon = addDays(thisMon, weekOffset * 7);
  const sun = addDays(mon, 6);
  const prevMon = addDays(mon, -7);

  const inRange = (g, s, e) => g.records.filter(r => {
    const d = parseKey(r.date);
    return dayIndex(d) >= dayIndex(s) && dayIndex(d) <= dayIndex(e);
  });

  let totalCount = 0, totalMin = 0, prevCount = 0, prevMin = 0;
  const daysWith = new Set();
  const lines = [];

  for (const g of state.goals) {
    const cur = inRange(g, mon, sun);
    const prev = inRange(g, prevMon, addDays(prevMon, 6));
    const amt = cur.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const pAmt = prev.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const min = cur.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
    const pMin = prev.reduce((s, r) => s + (Number(r.minutes) || 0), 0);
    const dset = new Set(cur.map(r => r.date));
    totalCount += cur.length; totalMin += min;
    prevCount += prev.length; prevMin += pMin;
    cur.forEach(r => daysWith.add(r.date));

    const dA = amt - pAmt;
    const dM = min - pMin;
    const catPart = g.category ? '【' + g.category + '】' : '';
    lines.push('· ' + catPart + g.name + '：' + num(amt) + g.unit + '（上周 ' + num(pAmt) + g.unit +
      (dA === 0 ? '，持平' : dA > 0 ? '，+' + num(dA) : '，' + num(dA)) + '）｜' +
      dset.size + ' 天｜' + min + ' 分钟' +
      (dM === 0 ? '，持平' : dM > 0 ? '，+' + dM : '，' + dM));
  }

  const notes = state.weekNotes[weekNotesKey(mon)] || {};
  const dCount = totalCount - prevCount;
  const dMin = totalMin - prevMin;

  let t = '【个人提升周报】' + mon.getFullYear() + '.' + (mon.getMonth() + 1) + '.' + mon.getDate() +
    ' — ' + (sun.getMonth() + 1) + '.' + sun.getDate() + '\n';
  t += '────────────────────\n';
  t += '打卡 ' + totalCount + ' 次（上周 ' + prevCount + ' 次，' +
    (dCount === 0 ? '持平' : (dCount > 0 ? '+' + dCount : dCount)) + '）\n';
  t += '投入 ' + totalMin + ' 分钟（上周 ' + prevMin + ' 分钟，' +
    (dMin === 0 ? '持平' : (dMin > 0 ? '+' + dMin : dMin)) + '）\n';
  t += '覆盖 ' + daysWith.size + ' / 7 天\n\n';
  t += '【分目标】\n' + (lines.length ? lines.join('\n') : '（本周无记录）') + '\n\n';
  t += '【保持】\n' + (notes.keep || '—') + '\n\n';
  t += '【问题】\n' + (notes.problem || '—') + '\n\n';
  t += '【尝试】\n' + (notes.try || '—') + '\n\n';
  t += '【下周预案】\n' + (notes.next || '—') + '\n';
  return t;
}

/* =========================================================
   事件：点击
   ========================================================= */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-tab]');
  if (navBtn) {
    tab = navBtn.dataset.tab;
    if (tab !== 'weekly') weekOffset = 0;
    render();
    window.scrollTo(0, 0);
    return;
  }

  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) {
    filterCat = filterBtn.dataset.filter;
    render();
    window.scrollTo(0, 0);
    return;
  }

  const catBtn = e.target.closest('[data-cat-pick]');
  if (catBtn) {
    const inp = document.getElementById('f-category');
    if (inp) {
      inp.value = catBtn.dataset.catPick;
      inp.focus();
    }
    return;
  }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action) {
    case 'new-goal': openGoalModal(null); break;
    case 'edit': {
      const g = state.goals.find(x => x.id === id);
      if (g) openGoalModal(g);
      break;
    }
    case 'delete': {
      const g = state.goals.find(x => x.id === id);
      if (!g) break;
      if (confirm('确定要删除「' + g.name + '」吗？\n它的 ' + g.records.length + ' 条打卡记录也会一起删除，无法撤销。')) {
        state.goals = state.goals.filter(x => x.id !== id);
        save(); render(); toast('已删除');
      }
      break;
    }
    case 'checkin': doCheckin(id); break;
    case 'del-rec': {
      const g = state.goals.find(x => x.id === id);
      if (!g) break;
      if (confirm('删除这条打卡记录？')) {
        g.records = g.records.filter(r => r.id !== el.dataset.rec);
        save(); render(); toast('已删除记录');
      }
      break;
    }
    case 'edit-rec': openRecordModal(id, el.dataset.rec); break;
    case 'save-rec': saveRecordEdit(el); break;

    case 'as-add': {
      const box = el.closest('.amount-seg-box');
      if (!box) break;
      const row = addAmtRowToBox(box);
      if (row) setTimeout(() => {
        const target = row.querySelector('.as-from');
        if (target) target.focus();
      }, 40);
      break;
    }
    case 'as-del': {
      const row = el.closest('.as-row');
      if (row) delAmtRow(row);
      break;
    }

    case 'ts-add': {
      const box = el.closest('.time-seg-box');
      if (!box) break;
      const row = addSegRowToBox(box);
      if (row) setTimeout(() => {
        const target = row.querySelector('.ts-end') || row.querySelector('.ts-start');
        if (target) target.focus();
      }, 40);
      break;
    }
    case 'ts-del': {
      const row = el.closest('.ts-row');
      if (row) delSegRow(row);
      break;
    }

    case 'review-done': {
      const g = state.goals.find(x => x.id === id);
      if (!g) break;
      const dk = el.dataset.date;
      const off = Number(el.dataset.off);
      if (!g.reviews) g.reviews = {};
      if (!g.reviews[dk]) g.reviews[dk] = [];
      if (g.reviews[dk].indexOf(off) === -1) g.reviews[dk].push(off);
      save(); render();
      toast('已复习 · 第 ' + (REVIEW_LABEL[off] || off) + ' 节点');
      break;
    }
    case 'toggle-sum': {
      el.classList.toggle('expanded');
      break;
    }

    case 'add-question': openQuestionModal(id, null); break;
    case 'edit-question': openQuestionModal(id, el.dataset.qid); break;
    case 'del-question': {
      const g = state.goals.find(x => x.id === id);
      if (!g) break;
      if (!confirm('删除这条疑问？')) break;
      g.questions = (g.questions || []).filter(q => q.id !== el.dataset.qid);
      save(); render(); toast('已删除');
      break;
    }
    case 'save-question': saveQuestion(el); break;

    case 'add-summary': openSummaryModal(id, null); break;
    case 'edit-summary': openSummaryModal(id, el.dataset.date); break;
    case 'save-summary': saveSummary(id); break;
    case 'del-summary': delSummary(el.dataset.id, el.dataset.date); break;

    case 'prev-week': weekOffset--; render(); break;
    case 'next-week': if (weekOffset < 0) { weekOffset++; render(); } break;
    case 'gen-report': {
      const out = document.getElementById('reportOut');
      if (out) { out.value = buildWeeklyText(); out.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      break;
    }
    case 'copy-report': {
      const out = document.getElementById('reportOut');
      if (!out || !out.value.trim()) { toast('请先生成周报'); break; }
      copyText(out.value);
      break;
    }
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'migrate': doMigrate(); break;
    case 'clear-sample': {
      if (confirm('清空当前所有目标与记录？此操作不可撤销。')) {
        state.goals = []; state.weekNotes = {};
        save(); render(); toast('已清空');
      }
      break;
    }
    case 'clear-all': {
      const v = prompt('这会删除全部数据和周报记录，且无法恢复。\n请输入「清空」两个字确认：');
      if (v === '清空') {
        state = { version: 2, goals: [], weekNotes: {} };
        save(); render(); toast('全部数据已清空');
      } else if (v !== null) {
        toast('输入不匹配，已取消');
      }
      break;
    }
    case 'modal-cancel': closeModal(); break;
    case 'modal-save': saveGoalModal(); break;
    case 'modal-color': {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('on'));
      el.classList.add('on');
      break;
    }
  }
});

/* =========================================================
   事件：输入
   ========================================================= */
document.addEventListener('input', e => {
  const t = e.target;

  if (t.classList.contains('as-from') || t.classList.contains('as-to')) {
    const card = t.closest('.goal-card');
    if (card) {
      const box = card.querySelector('.amount-seg-box');
      const g = state.goals.find(x => x.id === card.dataset.id);
      refreshAmtBox(box, g ? g.unit : '个');
      if (g) {
        syncAmtUI(card.dataset.id, card);
        refreshGoalProgress(card);
      }
    }
    return;
  }

  if (t.classList.contains('ts-start') || t.classList.contains('ts-end')) {
    const box = t.closest('.time-seg-box');
    if (box) {
      refreshSegBox(box);
      const card = box.closest('.goal-card');
      if (card && card.dataset.id) syncSegUI(card.dataset.id, card);
    }
    return;
  }

  if (t.closest('.modal') && (t.classList.contains('as-from') || t.classList.contains('as-to'))) {
    const box = t.closest('.amount-seg-box');
    if (box) refreshAmtBox(box, box.dataset.unit || '个');
    return;
  }
  if (t.closest('.modal') && (t.classList.contains('ts-start') || t.classList.contains('ts-end'))) {
    const box = t.closest('.time-seg-box');
    if (box) refreshSegBox(box);
    return;
  }

  if (t.dataset.note) {
    const wk = t.dataset.week;
    if (!state.weekNotes[wk]) state.weekNotes[wk] = {};
    state.weekNotes[wk][t.dataset.note] = t.value;
    save();
    return;
  }
});

document.addEventListener('change', e => {
  const t = e.target;

  if (t.dataset.role === 'date') {
    const u = getUI(t.dataset.id);
    u.date = t.value;
    return;
  }
  if (t.classList.contains('ts-start') || t.classList.contains('ts-end')) {
    const box = t.closest('.time-seg-box');
    if (box) {
      refreshSegBox(box);
      const card = box.closest('.goal-card');
      if (card && card.dataset.id) syncSegUI(card.dataset.id, card);
    }
    return;
  }
  if (t.classList.contains('as-from') || t.classList.contains('as-to')) {
    const box = t.closest('.amount-seg-box');
    if (box) {
      refreshAmtBox(box, box.dataset.unit || '个');
      const card = box.closest('.goal-card');
      if (card) {
        const g = state.goals.find(x => x.id === card.dataset.id);
        if (g) {
          syncAmtUI(card.dataset.id, card);
          refreshGoalProgress(card);
        }
      }
    }
    return;
  }
  if (t.id === 's-date') {
    const btn = document.querySelector('[data-action="save-summary"]');
    if (!btn) return;
    const g = state.goals.find(x => x.id === btn.dataset.id);
    const ta = document.getElementById('s-text');
    if (g && ta) {
      ta.value = (g.summaries && g.summaries[t.value]) || '';
    }
  }
});

/* =========================================================
   打卡
   ========================================================= */
function doCheckin(id) {
  const g = state.goals.find(x => x.id === id);
  if (!g) return;

  const card = document.querySelector('.goal-card[data-id="' + id + '"]');
  if (!card) return;

  const amtBox = card.querySelector('.amount-seg-box');
  const amtSegs = calcAmtSegs(readAmtRowsFrom(amtBox));
  if (!amtSegs.length) {
    toast('请填写「从多少」到「多少」');
    const first = amtBox && amtBox.querySelector('.as-from');
    if (first) first.focus();
    return;
  }
  const amount = amtSegs.reduce((a, b) => a + b.amount, 0);

  let minutes = null, segments = [];
  const tsBox = card.querySelector('.time-seg-box');
  if (tsBox) {
    const ts = calcSegs(readSegRowsFrom(tsBox));
    if (ts.length) {
      minutes = ts.reduce((a, b) => a + b.minutes, 0);
      segments = ts;
    }
  }

  const dateEl = card.querySelector('[data-role="date"]');
  const date = dateEl ? dateEl.value : todayKey();
  const backfill = date !== todayKey();

  const before = g.records.reduce((s, r) => s + (Number(r.amount) || 0), 0);

  g.records.push({
    id: uid(),
    date: date,
    amount: amount,
    amountSegments: amtSegs,
    minutes: minutes,
    segments: segments,
    backfill: backfill,
    createdAt: Date.now()
  });

  const after = before + amount;
  const total = Number(g.total) || 0;

  const u = getUI(id);
  u.date = todayKey(); u.amtSegs = []; u.segments = [];

  save();
  render();

  const minStr = (minutes && minutes > 0) ? ' · ' + minutes + ' 分钟' : '';

  if (before < total && after >= total) {
    fireConfetti();
    toast('目标达成！本次 +' + num(amount) + minStr);
  } else if (backfill) {
    toast('已补记 ' + fmtMD(parseKey(date)) + ' +' + num(amount) + minStr);
  } else if (!g.summaries || !g.summaries[todayKey()]) {
    toast('打卡 +' + num(amount) + minStr + ' · 记得合上书复述一下');
  } else {
    toast('打卡成功 +' + num(amount) + minStr);
  }
}

/* =========================================================
   编辑打卡记录
   ========================================================= */
function openRecordModal(goalId, recId) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const rec = g.records.find(r => r.id === recId);
  if (!rec) return;

  const aSegs = (rec.amountSegments && rec.amountSegments.length)
    ? rec.amountSegments
    : (rec.amount > 0 ? [{ from: 0, to: rec.amount }] : [{ from: '', to: '' }]);

  const amtRows = aSegs.map(s =>
    '<div class="as-row">' + amtRowHTML(s.from, s.to, g.unit) + '</div>'
  ).join('');

  const tSegs = (rec.segments && rec.segments.length)
    ? rec.segments
    : [{ start: '', end: '' }];

  const tsRows = tSegs.map(s =>
    '<div class="ts-row">' + tsRowHTML(s.start, s.end) + '</div>'
  ).join('');

  const html = '<div class="modal-backdrop" data-backdrop>' +
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<h2>编辑打卡记录</h2>' +
    '<div class="modal-hint" style="background:#f5f3ff;color:#6d28d9;font-weight:600">目标：' + esc(g.name) + '</div>' +
    '<div class="modal-hint">可以修改日期、数量和每一段时间。<br>日期改为今天以前的，会自动标记为「补」。</div>' +

    '<div class="field"><label>日期</label>' +
    '<select class="inp" id="r-date">' + dateOptionsHTML(rec.date) + '</select></div>' +

    '<div class="field"><label>投入时间（选填）</label>' +
    '<div class="time-seg-box">' +
    '<div class="ts-head">' +
    '<span class="ts-lbl">' + I.clock + '开始 — 结束</span>' +
    '<span class="ts-total empty" data-total>未填写</span>' +
    '</div>' +
    '<div class="ts-list">' + tsRows + '</div>' +
    '<button type="button" class="ts-add" data-action="ts-add">' + I.plus + '添加时间段</button>' +
    '</div></div>' +

    '<div class="field"><label>数量（' + esc(g.unit) + '）</label>' +
    '<div class="amount-seg-box" data-unit="' + esc(g.unit) + '">' +
    '<div class="as-head">' +
    '<span class="as-lbl">' + I.target + '从多少到多少</span>' +
    '<span class="as-total empty" data-amt-total>未填写</span>' +
    '</div>' +
    '<div class="as-list">' + amtRows + '</div>' +
    '<button type="button" class="as-add" data-action="as-add">' + I.plus + '添加一段</button>' +
    '</div></div>' +

    '<div class="modal-actions">' +
    '<button class="btn" data-action="modal-cancel">取消</button>' +
    '<button class="btn primary" data-action="save-rec" data-id="' + goalId + '" data-rec="' + recId + '">保存</button>' +
    '</div></div></div>';

  document.getElementById('modalRoot').innerHTML = html;
  bindBackdrop();

  const ab = document.querySelector('.modal .amount-seg-box');
  if (ab) refreshAmtBox(ab, g.unit);
  const tb = document.querySelector('.modal .time-seg-box');
  if (tb) refreshSegBox(tb);

  setTimeout(() => {
    const a = document.querySelector('.modal .as-from');
    if (a) a.focus();
  }, 60);
}

function saveRecordEdit(el) {
  const goalId = el.dataset.id;
  const recId = el.dataset.rec;
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const rec = g.records.find(r => r.id === recId);
  if (!rec) return;

  const dEl = document.getElementById('r-date');
  const date = dEl ? dEl.value : rec.date;
  if (!date) { toast('请选择日期'); return; }

  const amtBox = document.querySelector('.modal .amount-seg-box');
  const amtSegs = calcAmtSegs(readAmtRowsFrom(amtBox));
  if (!amtSegs.length) { toast('请填写「从多少」到「多少」'); return; }
  const amount = amtSegs.reduce((a, b) => a + b.amount, 0);

  let segments = [], minutes = null;
  const tsBox = document.querySelector('.modal .time-seg-box');
  if (tsBox) {
    const ts = calcSegs(readSegRowsFrom(tsBox));
    if (ts.length) {
      segments = ts;
      minutes = ts.reduce((a, b) => a + b.minutes, 0);
    }
  }

  rec.date = date;
  rec.amount = amount;
  rec.amountSegments = amtSegs;
  rec.segments = segments;
  rec.minutes = minutes;
  rec.backfill = date !== todayKey();

  closeModal();
  save(); render();
  toast('记录已更新');
}

}

document.addEventListener('click', e => {
  const sw = e.target.closest('.color-swatch');
  if (sw) modalState.color = sw.dataset.c;
}, true);

function closeModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

function saveGoalModal() {
  const name = (document.getElementById('f-name').value || '').trim();
  const unit = (document.getElementById('f-unit').value || '').trim() || '个';
  const total = Number(document.getElementById('f-total').value);
  const deadline = document.getElementById('f-deadline').value;
  const category = (document.getElementById('f-category').value || '').trim();
  const obstacle = (document.getElementById('f-obstacle').value || '').trim();
  const plan = (document.getElementById('f-plan').value || '').trim();

  if (!name) { toast('请填写目标名称'); return; }
  if (!total || total <= 0) { toast('总量需要大于 0'); return; }
  if (!deadline) { toast('请选择截止日'); return; }

  if (modalState.editingId) {
    const g = state.goals.find(x => x.id === modalState.editingId);
    if (g) {
      g.name = name; g.unit = unit; g.total = total; g.deadline = deadline;
      g.color = modalState.color; g.category = category;
      g.obstacle = obstacle; g.plan = plan;
    }
    toast('已保存');
  } else {
    state.goals.push({
      id: uid(), name, unit, total, deadline,
      color: modalState.color, category,
      obstacle, plan,
      createdAt: todayKey(),
      questions: [], summaries: {}, reviews: {},
      records: []
    });
    toast('目标已创建');
  }

  closeModal();
  save();
  render();
}

/* =========================================================
   疑问弹窗
   ========================================================= */
function openQuestionModal(goalId, qid) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const q = qid ? (g.questions || []).find(x => x.id === qid) : null;

  const html = '<div class="modal-backdrop" data-backdrop>' +
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<h2>' + (q ? '编辑疑问' : '记下疑问') + '</h2>' +
    (q ? '' : '<div class="modal-hint">读到不懂的地方，先记下来，不要停下来死磕。<br>继续往下读，往往后面会自己回答前面。</div>') +
    '<div class="field"><label>我的疑问</label>' +
    '<textarea id="q-text" style="min-height:86px" placeholder="例如：为什么作者说认知革命是偶然的？">' + esc(q ? q.text : '') + '</textarea></div>' +
    '<div class="field"><label>我的解答（可以以后回来补）</label>' +
    '<textarea id="q-answer" placeholder="想通了就写在这里">' + esc(q ? q.answer : '') + '</textarea></div>' +
    (q ? '<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:#4b5163">' +
      '<input type="checkbox" id="q-resolved"' + (q.resolved ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:#7c3aed"> 这个问题已经解决</label></div>' : '') +
    '<div class="modal-actions">' +
    '<button class="btn" data-action="modal-cancel">取消</button>' +
    '<button class="btn primary" data-action="save-question" data-id="' + goalId + '" data-qid="' + (qid || '') + '">保存</button>' +
    '</div></div></div>';

  document.getElementById('modalRoot').innerHTML = html;
  bindBackdrop();
  setTimeout(() => { const t = document.getElementById('q-text'); if (t && !q) t.focus(); }, 60);
}

function saveQuestion(el) {
  const goalId = el.dataset.id;
  const qid = el.dataset.qid;
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;

  const tEl = document.getElementById('q-text');
  const aEl = document.getElementById('q-answer');
  const rEl = document.getElementById('q-resolved');

  const text = (tEl ? tEl.value : '').trim();
  const answer = (aEl ? aEl.value : '').trim();
  if (!text) { toast('请先写下疑问'); if (tEl) tEl.focus(); return; }

  if (!g.questions) g.questions = [];

  if (qid) {
    const q = g.questions.find(x => x.id === qid);
    if (q) {
      q.text = text;
      q.answer = answer;
      q.resolved = !!(rEl && rEl.checked);
    }
    toast('疑问已更新');
  } else {
    g.questions.push({
      id: uid(), date: todayKey(), text: text, answer: answer,
      resolved: false, createdAt: Date.now()
    });
    toast('疑问已记下');
  }

  closeModal();
  save();
  render();
}

/* =========================================================
   复述总结弹窗
   ========================================================= */
function openSummaryModal(goalId, date) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  const d = date || todayKey();
  const cur = (g.summaries && g.summaries[d]) || '';
  const isEditing = !!cur;

  const html = '<div class="modal-backdrop" data-backdrop>' +
    '<div class="modal" role="dialog" aria-modal="true">' +
    '<h2>' + (isEditing ? '修改这篇复述' : '合上书，用自己的话复述') + '</h2>' +
    '<div class="modal-hint">' +
    (isEditing
      ? '可以改内容、切到别的日期；清空后保存会删除这一篇。'
      : '不要翻书，凭记忆写下今天读到的核心内容。<br>写不出来，就说明该回去重读那一部分。') +
    '</div>' +
    '<div class="field"><label>哪一天</label>' +
    '<select class="inp" id="s-date">' + dateOptionsHTML(d) + '</select></div>' +
    '<div class="field"><label>复述总结</label>' +
    '<textarea id="s-text" style="min-height:140px" placeholder="今天我读到……\n\n作者的核心观点是……\n\n我自己的理解是……">' + esc(cur) + '</textarea></div>' +
    '<div class="modal-actions">' +
    (isEditing ? '<button class="btn danger" data-action="del-summary" data-id="' + goalId + '" data-date="' + d + '">删除这篇</button>' : '') +
    '<button class="btn" data-action="modal-cancel">取消</button>' +
    '<button class="btn primary" data-action="save-summary" data-id="' + goalId + '">保存</button>' +
    '</div></div></div>';

  document.getElementById('modalRoot').innerHTML = html;
  bindBackdrop();
  setTimeout(() => { const t = document.getElementById('s-text'); if (t) t.focus(); }, 60);
}

function saveSummary(goalId) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;

  const dEl = document.getElementById('s-date');
  const tEl = document.getElementById('s-text');
  const dk = dEl ? dEl.value : todayKey();
  const text = (tEl ? tEl.value : '').trim();

  if (!g.summaries) g.summaries = {};

  if (text) {
    g.summaries[dk] = text;
  } else {
    delete g.summaries[dk];
  }

  closeModal();
  save();
  render();
  toast(text ? '复述已保存' : '已清空这篇复述');
}

function delSummary(goalId, date) {
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  if (!g.summaries || !g.summaries[date]) return;
  if (!confirm('删除 ' + fmtMD(parseKey(date)) + ' 这篇复述？')) return;
  delete g.summaries[date];
  closeModal();
  save();
  render();
  toast('已删除这篇复述');
}

/* =========================================================
   导入 / 导出 / 迁移
   ========================================================= */
function doExport() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = '个人提升备份-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('备份已导出');
}

function doImport() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (err) { toast('文件不是有效的 JSON'); return; }
      const migrated = migrate(parsed);
      if (!migrated || !migrated.goals.length) { toast('没有识别到可导入的目标'); return; }
      if (!confirm('导入会覆盖当前的全部数据，确定继续吗？\n（识别到 ' + migrated.goals.length + ' 个目标）')) return;
      state = migrated;
      filterCat = 'all';
      save(); render(); toast('导入成功');
    };
    reader.readAsText(file);
  };
  input.click();
}

function doMigrate() {
  let found = null;
  for (const k of LEGACY_KEYS) {
    const raw = localStorage.getItem(k);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        const m = migrate(parsed);
        if (m && m.goals.length) { found = { key: k, data: m }; break; }
      } catch (e) { }
    }
  }

  if (!found) {
    const v = prompt('没有在本地找到旧版本数据。\n\n如果你手上有旧版本的 JSON 文本，可以直接粘贴到这里进行迁移：');
    if (!v) return;
    let parsed;
    try { parsed = JSON.parse(v); }
    catch (e) { toast('粘贴的内容不是有效的 JSON'); return; }
    const m = migrate(parsed);
    if (!m || !m.goals.length) { toast('没有识别到可迁移的目标'); return; }
    if (!confirm('迁移会覆盖当前数据，识别到 ' + m.goals.length + ' 个目标，继续吗？')) return;
    state = m; filterCat = 'all'; save(); render(); toast('迁移完成');
    return;
  }

  if (!confirm('在 localStorage 的「' + found.key + '」中找到了旧数据（' + found.data.goals.length + ' 个目标）。\n\n迁移会覆盖当前数据，确定继续吗？')) return;
  state = found.data;
  filterCat = 'all';
  save(); render(); toast('迁移完成');
}

/* =========================================================
   复制 / Toast
   ========================================================= */
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('已复制到剪贴板')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制到剪贴板'); }
  catch (e) { toast('复制失败，请手动选择文本'); }
  document.body.removeChild(ta);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2100);
}

/* =========================================================
   彩带动效
   ========================================================= */
function fireConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const colors = ['#7c3aed', '#a855f7', '#10b981', '#f59e0b', '#ef4444', '#3b82f6', '#ec4899'];
  const parts = [];
  const originX = W / 2;
  const originY = Math.min(H * 0.34, 260);

  for (let i = 0; i < 130; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 3 + Math.random() * 11;
    parts.push({
      x: originX + (Math.random() - 0.5) * 160,
      y: originY + (Math.random() - 0.5) * 60,
      vx: Math.cos(angle) * spd * (0.6 + Math.random() * 0.6),
      vy: Math.sin(angle) * spd * 0.7 - 5 - Math.random() * 5,
      w: 4 + Math.random() * 7,
      h: 3 + Math.random() * 6,
      color: colors[(Math.random() * colors.length) | 0],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.35,
      shape: Math.random() > 0.65 ? 'circle' : 'rect'
    });
  }

  const start = performance.now();
  const DURATION = 2600;

  function tick(t) {
    const elapsed = t - start;
    ctx.clearRect(0, 0, W, H);
    const alpha = Math.max(0, 1 - Math.pow(elapsed / DURATION, 2.2));
    let alive = false;

    for (const p of parts) {
      p.vy += 0.32;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y < H + 60) alive = true;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }

    if (alive && elapsed < DURATION) {
      requestAnimationFrame(tick);
    } else {
      ctx.clearRect(0, 0, W, H);
    }
  }
  requestAnimationFrame(tick);
}

/* =========================================================
   启动
   ========================================================= */
function boot() {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      const m = migrate(parsed);
      state = m || seed();
    } catch (e) {
      state = seed();
    }
  } else {
    state = seed();
  }
  save();
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

boot();
